services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_table
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
    # 仅绑定本机回环，避免公网暴露；本机调试可用 docker compose exec postgres psql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_table"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server_nest/Dockerfile
    environment:
      SERVER_NAME: ${SERVER_NAME:-D&D Table Tool}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://dnd:${POSTGRES_PASSWORD:-dnd}@postgres:5432/dnd_table
      JWT_SECRET: ${JWT_SECRET:-change-me}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
