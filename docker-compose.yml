services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_table
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_table"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: node:22-alpine
    working_dir: /app/apps/server_nest
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    environment:
      SERVER_NAME: ${SERVER_NAME:-D&D Table Tool}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://dnd:dnd@postgres:5432/dnd_table
      JWT_SECRET: ${JWT_SECRET:-change-me}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      UPLOAD_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
