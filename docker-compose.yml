services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd_table
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # 仅绑定本机回环，避免公网暴露；本机调试可用 docker compose exec postgres psql
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_table"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server_nest/Dockerfile
      # 国内服务器可把 .env 的 NPM_REGISTRY 改成 https://registry.npmmirror.com，
      # 否则镜像构建可能长时间卡在 `npm ci`。
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-OhMyDungeon}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DATABASE_URL: postgresql://dnd:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/dnd_table
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  uploads:
